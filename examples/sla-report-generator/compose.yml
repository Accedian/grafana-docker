services:
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=http://localhost:${PROMETHEUS_PORT:-9091}/prometheus"
      - "--web.route-prefix=/prometheus"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: ${GRAFANA_IMAGE:-gcr.io/npav-172917/grafana:sla-dashboard-local}
    platform: linux/amd64
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana-local-only
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
