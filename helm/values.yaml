# Default values for grafana.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  deployment_type:
  dns:
    support: true
  # Required by PCA's IPv4 access mode when DNS support is disabled.
  external_ip: ""
  images:
    pullSecrets: []
  analytics:
    deployment:
      name: "deployment"
      domain: "accedian.local"
      
grafana:
  replicaCount: 1
  server:
    serveFromSubPath: true
  image:
    registry: gcr.io
    repository: npav-172917/grafana
    pullPolicy: IfNotPresent 

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: "grafana"

  env:
    LOG_LEVEL: error

  renderer:
    enabled: true
    image:
      registry: gcr.io
      repository: npav-172917/3rdparty/docker.io/grafana/grafana-image-renderer
      tag: "v5.12.5"
      digest: "sha256:76542ccc4c045e5ff9f80f87b25de6fcc71b31222172de5031a8ceba33772ee1"
      pullPolicy: IfNotPresent
    # Empty means Helm creates/reuses a Secret dedicated to this release.
    existingSecret: ""
    secretKey: token
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "4"
        memory: "16Gi"

  auth:
    anonymous:
      enabled: false
      orgRole: Viewer

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

blackbox_exporter:
  image:
    registry: gcr.io
    repository: npav-172917/3rdparty/quay.io/prometheus/blackbox-exporter
    tag: "20231205"
    pullPolicy: IfNotPresent 
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
