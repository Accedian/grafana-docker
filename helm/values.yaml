# Default values for grafana.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  deployment_type:
  external_ip: ""
  clusterIPPort: 443
  clusterIPPortAdmin: 2443
  clusterIPPortZitadelAuth: 3443
  dns:
    support: true
  images:
    pullSecrets: []
  analytics:
    deployment:
      name: "deployment"
      domain: "accedian.local"

# URL of the Prometheus server that Grafana's Prometheus datasource queries.
# When empty, the datasource falls back to the bundled kube-prometheus-stack
# service, which is installed with routePrefix=/prometheus/.
prometheusUrl: ""

grafana:
  # Empty derives the HTTPS browser origin from deployment globals.
  # Does not change the root tenant hostname used for AAA client discovery.
  publicOrigin: ""
  # An umbrella chart may supply the origin from its AAA configuration.
  # This required ConfigMap overrides browser URLs only, before activation.
  publicOriginConfigMap: ""
  replicaCount: 1
  image:
    registry: gcr.io
    repository: npav-172917/grafana
    pullPolicy: IfNotPresent 

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: "grafana"

  env:
    LOG_LEVEL: error

  auth:
    anonymous:
      enabled: false
      orgRole: Viewer
    basic:
      enabled: true
    genericOAuth:
      enabled: false
      # The parent chart publishes verified OAuth values after preparation.
      # An empty or absent profile keeps the fresh-install baseline protected.
      activationConfigMap: ""
      # Umbrella charts can disable OAuth when the Zitadel stack is absent.
      fullDeploymentOnly: false
      name: Zitadel
      allowSignUp: true
      autoLogin: true
      # Public identifier, not a credential. Leave empty to discover it.
      clientId: ""
      # Deployment tooling owns the internal TLS provider Service/certificate.
      internalProvider:
        enabled: false
        tlsCASecretName: grafana-oidc-provider-tls
      clientIdDiscovery:
        # Preserve HTTPS URL identity but connect to the same-namespace nginx.
        internalNginx: false
        # Optional deployment CA; only ca.crt is mounted, never the private key.
        tlsCASecretName: ""
        # Empty uses root HTTPS onboarding: external IP:2443 without DNS.
        url: ""
        # Empty uses the logical deployment hostname, including without DNS.
        host: ""
        application: pca-grafana-pkce
        timeoutSeconds: 900
      scopes: "openid profile email"
      authUrl: ""
      tokenUrl: ""
      apiUrl: ""
      # Grafana appends the resolved public client ID and exact return URI at
      # startup so Zitadel can terminate the browser SSO session on logout.
      endSessionUrl: ""
      postLogoutRedirectUrl: ""
      usePkce: true
      # Use the immutable Zitadel subject as the Grafana login identifier.
      loginAttributePath: sub
      nameAttributePath: name
      emailAttributePath: email
      # Authorization remains local to Grafana; new users receive Viewer.
      skipOrgRoleSync: true
      # Opt-in: root Analytics skylight-admin grants become organization Admin.
      # Resolve organization/project IDs from the same HTTPS tenant-info read.
      deploymentAdminRole:
        enabled: false

  security:
    # Grafana is externally HTTPS even though nginx uses HTTP to the pod.
    cookieSecure: true
    # Lax permits the top-level OIDC authorization-code callback.
    cookieSameSite: lax
    # Empty keeps Grafana's built-in default key so existing grafana.db files
    # stay decryptable. Umbrella charts set this on fresh installs only.
    secretKeyExistingSecret: ""
    secretKeyKey: "secret-key"

  # Helm/Kubernetes only. Docker Swarm never sets PCA_ENABLE_K8S_CUSTOMER_ALERTS.
  customerK8sAlerts:
    enabled: true

  proxy:
    enabled: false
    httpProxy: ""
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,.svc,.svc.cluster.local"

  smtp:
    enabled: false
    host: ""
    user: ""
    fromAddress: ""
    fromName: "Cisco PCA Alerts"
    startTlsPolicy: "OpportunisticStartTLS"
    existingSecret: ""
    passwordKey: "password"
    caCertExistingSecret: ""
    caCertKey: "ca.crt"
    secretChecksum: ""
    caCertChecksum: ""
    allowPrivate: false

  alerting:
    webhookSecretChecksum: ""
    contactPoints:
      email:
        enabled: false
        addresses: ""
        singleEmail: false
      webhook:
        enabled: false
        url: ""
        httpMethod: "POST"
        maxAlerts: 0
        authType: "none"
        basicAuthUser: ""
        existingSecret: ""
        authSecretKey: "secret"
        caCertPem: ""
        allowPrivate: false
    notificationPolicy:
      managed: false
      groupWait: "30s"
      groupInterval: "5m"
      repeatInterval: "4h"
      # One-shot unlock of a previously file-provisioned policy tree.
      # Leave false on routine upgrades so UI-created policies survive.
      # Required to delete customer contact points that a leftover managed
      # policy still references: Grafana 12.1 rejects deleteContactPoints
      # while a route uses the receiver (ErrContactPointReferenced).
      resetPoliciesOnDisable: false

  users:
    autoAssignOrgRole: Viewer

  networkPolicy:
    enabled: false
    # These peers may reach Grafana over the network. They are not trusted to
    # assert user identity through Grafana Auth Proxy headers.
    trustedIngress: []
    # When the NetworkPolicy is enabled, also deny IMDS and unmatched
    # cluster-internal egress while allowing DNS, Prometheus, ClickHouse,
    # same-namespace HTTPS, SMTP, and public HTTPS webhooks.
    blockMetadataAndClusterInternal: true

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}

  # The image pins grafana to UID/GID 472 before the Debian package postinst
  # (which would otherwise allocate a dynamic system GID). 0440 Secret mounts
  # with this fsGroup stay group-readable as the grafana user's primary GID
  # after gosu. run.sh also restages $__file secrets to grafana-owned 0400
  # copies so a mismatched supplemental group cannot hide the mount.
  podSecurityContext:
    fsGroup: 472

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

blackbox_exporter:
  image:
    registry: gcr.io
    repository: npav-172917/3rdparty/quay.io/prometheus/blackbox-exporter
    tag: "20231205"
    pullPolicy: IfNotPresent 
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
