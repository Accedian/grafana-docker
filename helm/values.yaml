# Default values for grafana.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  deployment_type:
  images:
    pullSecrets: []
  analytics:
    deployment:
      name: "deployment"
      domain: "accedian.local"
      
grafana:
  replicaCount: 1
  image:
    registry: gcr.io
    repository: npav-172917/grafana
    pullPolicy: IfNotPresent 

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: "grafana"

  env:
    LOG_LEVEL: error

  auth:
    anonymous:
      enabled: false
      orgRole: Viewer
    basic:
      enabled: true
    genericOAuth:
      enabled: false
      name: Zitadel
      allowSignUp: true
      autoLogin: true
      # Public identifier, not a credential. Leave empty to discover it.
      clientId: ""
      clientIdDiscovery:
        url: ""
        organization: ""
        project: ""
        application: ""
        timeoutSeconds: 900
      scopes: "openid profile email"
      authUrl: ""
      tokenUrl: ""
      apiUrl: ""
      # Grafana appends the resolved public client ID and exact return URI at
      # startup so Zitadel can terminate the browser SSO session on logout.
      endSessionUrl: ""
      postLogoutRedirectUrl: ""
      usePkce: true
      # Verify the signature of identity claims before using them.
      validateIdToken: true
      jwkSetUrl: ""
      # Use the immutable Zitadel subject as the Grafana login identifier.
      loginAttributePath: sub
      nameAttributePath: name
      emailAttributePath: email
      # Authorization remains local to Grafana; new users receive Viewer.
      skipOrgRoleSync: true

  security:
    # Grafana is externally HTTPS even though nginx uses HTTP to the pod.
    cookieSecure: true
    # Lax permits the top-level OIDC authorization-code callback.
    cookieSameSite: lax

  users:
    autoAssignOrgRole: Viewer

  networkPolicy:
    enabled: false
    trustedIngress: []

  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

blackbox_exporter:
  image:
    registry: gcr.io
    repository: npav-172917/3rdparty/quay.io/prometheus/blackbox-exporter
    tag: "20231205"
    pullPolicy: IfNotPresent 
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
