{{- if .Values.grafana.networkPolicy.enabled }}
{{- if empty .Values.grafana.networkPolicy.trustedIngress }}
{{- fail "grafana.networkPolicy.trustedIngress must contain at least one peer when the NetworkPolicy is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "grafana.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.grafana.networkPolicy.trustedIngress | nindent 8 }}
      ports:
        - protocol: TCP
          port: http
{{- end }}
