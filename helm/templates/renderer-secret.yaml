{{- if and .Values.grafana.renderer.enabled (not .Values.grafana.renderer.existingSecret) -}}
{{- $name := include "grafana.rendererSecretName" . -}}
{{- $key := required "grafana.renderer.secretKey is required" .Values.grafana.renderer.secretKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := "" -}}
{{- if $existing -}}
  {{- $token = required "Existing renderer Secret lacks the configured token key" (index $existing.data $key) -}}
{{- else -}}
  {{- $token = randAlphaNum 64 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key | quote }}: {{ $token | quote }}
{{- end }}
