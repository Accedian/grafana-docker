{{- if .Values.grafana.auth.genericOAuth.enabled }}
{{- $discovery := .Values.grafana.auth.genericOAuth.clientIdDiscovery }}
{{- if and (empty .Values.grafana.auth.genericOAuth.clientId) (or (empty $discovery.url) (empty $discovery.organization) (empty $discovery.project) (empty $discovery.application)) }}
{{- fail "generic OAuth requires clientId or complete clientIdDiscovery configuration" }}
{{- end }}
{{- if or (empty .Values.grafana.auth.genericOAuth.authUrl) (empty .Values.grafana.auth.genericOAuth.tokenUrl) (empty .Values.grafana.auth.genericOAuth.apiUrl) }}
{{- fail "generic OAuth requires authUrl, tokenUrl, and apiUrl" }}
{{- end }}
{{- end }}

kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "grafana.fullname" . }}-config
data:
    GF_SERVER_ROOT_URL: "https://{{ .Values.global.analytics.deployment.name }}.{{ .Values.global.analytics.deployment.domain }}/grafana"
    GF_SERVER_DOMAIN: "{{ .Values.global.analytics.deployment.name }}.{{ .Values.global.analytics.deployment.domain }}"
    GF_AUTH_ANONYMOUS_ENABLED: {{ .Values.grafana.auth.anonymous.enabled | quote }}
    GF_AUTH_ANONYMOUS_ORG_ROLE: {{ .Values.grafana.auth.anonymous.orgRole | quote }}
    GF_AUTH_PROXY_ENABLED: {{ .Values.grafana.auth.proxy.enabled | quote }}
    GF_AUTH_PROXY_HEADER_NAME: {{ .Values.grafana.auth.proxy.headerName | quote }}
    GF_AUTH_PROXY_HEADER_PROPERTY: {{ .Values.grafana.auth.proxy.headerProperty | quote }}
    GF_AUTH_PROXY_AUTO_SIGN_UP: {{ .Values.grafana.auth.proxy.autoSignUp | quote }}
    GF_AUTH_PROXY_SYNC_TTL: {{ .Values.grafana.auth.proxy.syncTtl | quote }}
    GF_AUTH_PROXY_HEADERS: {{ .Values.grafana.auth.proxy.headers | quote }}
    GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: {{ .Values.grafana.auth.proxy.enableLoginToken | quote }}
    GF_AUTH_DISABLE_SIGNOUT_MENU: {{ and .Values.grafana.auth.proxy.enabled .Values.grafana.auth.proxy.disableSignoutMenu | quote }}
    GF_AUTH_BASIC_ENABLED: {{ .Values.grafana.auth.basic.enabled | quote }}
    GF_AUTH_GENERIC_OAUTH_ENABLED: {{ .Values.grafana.auth.genericOAuth.enabled | quote }}
    GF_AUTH_GENERIC_OAUTH_NAME: {{ .Values.grafana.auth.genericOAuth.name | quote }}
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: {{ .Values.grafana.auth.genericOAuth.allowSignUp | quote }}
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: {{ .Values.grafana.auth.genericOAuth.autoLogin | quote }}
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ .Values.grafana.auth.genericOAuth.clientId | quote }}
    GRAFANA_OAUTH_CLIENT_ID_DISCOVERY_URL: {{ .Values.grafana.auth.genericOAuth.clientIdDiscovery.url | quote }}
    GRAFANA_OAUTH_CLIENT_ID_DISCOVERY_ORGANIZATION: {{ .Values.grafana.auth.genericOAuth.clientIdDiscovery.organization | quote }}
    GRAFANA_OAUTH_CLIENT_ID_DISCOVERY_PROJECT: {{ .Values.grafana.auth.genericOAuth.clientIdDiscovery.project | quote }}
    GRAFANA_OAUTH_CLIENT_ID_DISCOVERY_APPLICATION: {{ .Values.grafana.auth.genericOAuth.clientIdDiscovery.application | quote }}
    GRAFANA_OAUTH_CLIENT_ID_DISCOVERY_TIMEOUT_SECONDS: {{ .Values.grafana.auth.genericOAuth.clientIdDiscovery.timeoutSeconds | quote }}
    GF_AUTH_GENERIC_OAUTH_SCOPES: {{ .Values.grafana.auth.genericOAuth.scopes | quote }}
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: {{ .Values.grafana.auth.genericOAuth.authUrl | quote }}
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: {{ .Values.grafana.auth.genericOAuth.tokenUrl | quote }}
    GF_AUTH_GENERIC_OAUTH_API_URL: {{ .Values.grafana.auth.genericOAuth.apiUrl | quote }}
    GF_AUTH_GENERIC_OAUTH_USE_PKCE: {{ .Values.grafana.auth.genericOAuth.usePkce | quote }}
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: {{ .Values.grafana.auth.genericOAuth.loginAttributePath | quote }}
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: {{ .Values.grafana.auth.genericOAuth.nameAttributePath | quote }}
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: {{ .Values.grafana.auth.genericOAuth.emailAttributePath | quote }}
    GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: {{ .Values.grafana.auth.genericOAuth.skipOrgRoleSync | quote }}
    GF_SECURITY_COOKIE_SECURE: {{ .Values.grafana.security.cookieSecure | quote }}
    GF_SECURITY_COOKIE_SAMESITE: {{ .Values.grafana.security.cookieSameSite | quote }}
    GF_USERS_AUTO_ASSIGN_ORG_ROLE: {{ .Values.grafana.users.autoAssignOrgRole | quote }}
    GF_LOG_LEVEL: "{{ .Values.grafana.env.LOG_LEVEL }}"
