apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_datasource: "true"
  name: prometheus-datasource
data:
  prometheus-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      orgId: 1
      uid: prometheus
      url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      basicAuth: false
      isDefault: true
      version: 1
      editable: true
    - name: Elasticsearch
      type: elasticsearch
      access: proxy
      orgId: 1
      uid: elasticsearch
      url: http://elasticsearch01:9200
      database: "filebeat-*"
      jsonData:
        timeField: "@timestamp"
        esVersion: 70
      version: 1
      editable: true
