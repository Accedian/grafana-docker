apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_datasource: "true"
  name: prometheus-datasource
data:
  prometheus-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      orgId: 1
      uid: prometheus
      url: {{ .Values.prometheusUrl | default "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/prometheus" | quote }}
      basicAuth: false
      isDefault: true
      # No "version": Grafana bumps the stored one on restart, after which a fixed
      # provisioned version is never newer and url changes are silently skipped.
      editable: true
