{{- $oauth := .Values.grafana.auth.genericOAuth }}
{{- $discoveryCA := and $oauth.enabled (or (not $oauth.fullDeploymentOnly) .Values.global.skylight_full_version) $oauth.clientIdDiscovery.tlsCASecretName }}
{{- $providerCA := and $oauth.enabled (or (not $oauth.fullDeploymentOnly) .Values.global.skylight_full_version) $oauth.internalProvider.enabled }}
{{- $smtp := default dict .Values.grafana.smtp }}
{{- $alerting := default dict .Values.grafana.alerting }}
{{- $cps := default dict $alerting.contactPoints }}
{{- $webhook := default dict $cps.webhook }}
{{- $security := default dict .Values.grafana.security }}
{{- $webhookEnabled := include "grafana.customerWebhookEnabled" . }}
{{- $authType := default "none" $webhook.authType }}
{{- $webhookAuth := and $webhookEnabled (has $authType (list "bearer" "basic")) }}
{{- $mountPolicies := include "grafana.renderNotificationPolicies" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: {{ include "grafana.fullname" . }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  {{- if not .Values.grafana.autoscaling.enabled }}
  replicas: {{ .Values.grafana.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "grafana.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "grafana.fullname" . }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/alerting-provisioning: {{ include (print $.Template.BasePath "/alerting-provisioning.yaml") . | sha256sum }}
        {{- with $smtp.secretChecksum }}
        checksum/smtp-secret: {{ . | quote }}
        {{- end }}
        {{- with $alerting.webhookSecretChecksum }}
        checksum/webhook-secret: {{ . | quote }}
        {{- end }}
        {{- with $smtp.caCertChecksum }}
        checksum/ca-cert: {{ . | quote }}
        {{- end }}
      {{- with .Values.grafana.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "grafana.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "grafana.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.grafana.podSecurityContext | nindent 8 }}
      imagePullSecrets: {{ toYaml .Values.global.images.pullSecrets | nindent 14 }}
    {{- if eq .Values.global.deployment_type "dev" }}
      nodeSelector:
        size: dev-pool
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: devpool
    {{- end }}        
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.grafana.securityContext | nindent 12 }}
          image: {{ .Values.grafana.image.registry }}/{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # Client discovery finishes before Grafana opens its HTTP listener.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "grafana.fullname" . }}-config
            {{- if and .Values.grafana.auth.genericOAuth.enabled .Values.grafana.publicOriginConfigMap (empty .Values.grafana.auth.genericOAuth.activationConfigMap) (or (not .Values.grafana.auth.genericOAuth.fullDeploymentOnly) .Values.global.skylight_full_version) }}
            # The parent supplies the same browser origin it registers in AAA.
            - configMapRef:
                name: {{ .Values.grafana.publicOriginConfigMap | quote }}
            {{- end }}
            {{- if and .Values.grafana.auth.genericOAuth.enabled .Values.grafana.auth.genericOAuth.activationConfigMap (or (not .Values.grafana.auth.genericOAuth.fullDeploymentOnly) .Values.global.skylight_full_version) }}
            # Last wins: the verified activation profile overrides the baseline.
            - configMapRef:
                name: {{ .Values.grafana.auth.genericOAuth.activationConfigMap | quote }}
                optional: true
            {{- end }}
          {{- if $webhookAuth }}
          env:
            - name: PCA_GRAFANA_WEBHOOK_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "webhook bearer/basic auth requires alerting.contactPoints.webhook.existingSecret" $webhook.existingSecret | quote }}
                  key: {{ default "secret" $webhook.authSecretKey | quote }}
          {{- end }}
          volumeMounts:
            {{- if $providerCA }}
            - name: grafana-provider-ca
              mountPath: /etc/grafana-provider-ca
              readOnly: true
            {{- end }}
            {{- if $discoveryCA }}
            - name: grafana-discovery-ca
              mountPath: /etc/grafana-discovery-ca
              readOnly: true
            {{- end }}
            - name: {{ include "grafana.fullname" . }}-data
              mountPath: /var/lib/grafana
            - name: prometheus-datasource
              mountPath: /tmp/provisioning/datasources/prometheus-datasource.yaml
              subPath: prometheus-datasource.yaml
            - name: alerting-provisioning
              mountPath: /tmp/provisioning/alerting/customer-contact-points.yaml
              subPath: customer-contact-points.yaml
              readOnly: true
            {{- if $mountPolicies }}
            - name: alerting-provisioning
              mountPath: /tmp/provisioning/alerting/customer-notification-policies.yaml
              subPath: customer-notification-policies.yaml
              readOnly: true
            {{- end }}
            {{- if and (default false $smtp.enabled) $smtp.existingSecret }}
            - name: grafana-smtp
              mountPath: /var/run/secrets/grafana-smtp
              readOnly: true
            {{- end }}
            {{- if $security.secretKeyExistingSecret }}
            - name: grafana-security
              mountPath: /var/run/secrets/grafana-security
              readOnly: true
            {{- end }}
            {{- if $smtp.caCertExistingSecret }}
            - name: grafana-ca
              mountPath: /var/run/secrets/grafana-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- if $providerCA }}
        - name: grafana-provider-ca
          secret:
            secretName: {{ required "Internal OAuth requires internalProvider.tlsCASecretName" $oauth.internalProvider.tlsCASecretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if $discoveryCA }}
        - name: grafana-discovery-ca
          secret:
            secretName: {{ $oauth.clientIdDiscovery.tlsCASecretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: prometheus-datasource
          configMap:
            name: prometheus-datasource
        - name: alerting-provisioning
          configMap:
            name: {{ include "grafana.fullname" . }}-alerting-provisioning
        {{- if and (default false $smtp.enabled) $smtp.existingSecret }}
        - name: grafana-smtp
          secret:
            secretName: {{ $smtp.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ default "password" $smtp.passwordKey | quote }}
                path: password
        {{- end }}
        {{- if $security.secretKeyExistingSecret }}
        - name: grafana-security
          secret:
            secretName: {{ $security.secretKeyExistingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ default "secret-key" $security.secretKeyKey | quote }}
                path: secret-key
        {{- end }}
        {{- if $smtp.caCertExistingSecret }}
        - name: grafana-ca
          secret:
            secretName: {{ $smtp.caCertExistingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ default "ca.crt" $smtp.caCertKey | quote }}
                path: ca.crt
        {{- end }}
        

      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
        - metadata:
            name: {{ include "grafana.fullname" . }}-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: {{ .Values.grafana.data_volume_size | default "50Gi"}}
