name: pa07-observability

services:
  simulator:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        pip --isolated install --no-cache-dir --only-binary=:all: --require-hashes
        --index-url https://pypi.org/simple -r requirements.txt
        && exec python simulator.py --bind 0.0.0.0 --port 9999 --scenarios scenarios.yaml
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./simulator.py:/app/simulator.py:ro
      - ./pa07.py:/app/pa07.py:ro
      - ./extract_metrics.py:/app/extract_metrics.py:ro
      - ./scenarios.yaml:/app/scenarios.yaml:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ../../dashboards:/app/dashboards:ro
    ports:
      - "127.0.0.1:19999:9999"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9999/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus.qa.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      simulator:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana-provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-provisioning/dashboards/pa07.yml:/etc/grafana/provisioning/dashboards/pa07.yml:ro
      - ../../dashboards/Customer (swarm)/pca-pa-ingestion-pipeline.json:/var/lib/grafana/dashboards/pa.json:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - prometheus
